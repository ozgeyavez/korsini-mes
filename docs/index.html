<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>MCC Korsini MES</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>/* Layout: MCC kurumsal dili — beyaz üst bar + logo ve logodaki üç renkli şerit; solda modül grupları (Üretim, Kalite, Bakım, Takip, Yönetim); açık mavi-gri zeminde beyaz kartlar. */
:root{
  --bg:#f2f6f7; --surface:#ffffff; --surface-2:#eef3f5; --line:#dce6eb; --line-2:#c7d5dc;
  --fg:#212529; --muted:#5d6e76; --faint:#8a9ba3;
  --brand:#2bb673; --brand-deep:#1c784c; --brand-ink:#ffffff; --brand-soft:#e3f5ec;
  --blue:#6fb0e1; --blue-soft:#e6f1fa; --yellow:#ffd744;
  --ok:#1f8f57; --ok-bg:#e3f5ec; --bad:#cf3b3b; --bad-bg:#fdeaea; --warn:#9a6a00; --warn-bg:#fff4cf; --idle:#6c7a81; --idle-bg:#eaeff1; --info:#2f6f9f; --info-bg:#e6f1fa;
  --row-err:#fff6f6; --logo-ink:#1d1d1b; --shadow:0 1px 2px rgba(33,37,41,.05),0 4px 14px rgba(33,37,41,.05); --scrim:rgba(20,28,32,.45);
  --f-body:"Hanken Grotesk","Neuzeit Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11181b; --surface:#192226; --surface-2:#212c31; --line:#2c3a40; --line-2:#3a4b52;
  --fg:#e8eef0; --muted:#9daeb5; --faint:#7a8b92;
  --brand:#34c27f; --brand-deep:#5fd49b; --brand-ink:#08130d; --brand-soft:#173327; --blue-soft:#172a38;
  --ok:#4fd08f; --ok-bg:#173327; --bad:#f07272; --bad-bg:#3a1d1f; --warn:#f3c54d; --warn-bg:#3a3014; --idle:#a3b1b7; --idle-bg:#263136; --info:#8cc3ec; --info-bg:#172a38;
  --row-err:#2a1c1e; --logo-ink:#f2f5f6; --shadow:none; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11181b; --surface:#192226; --surface-2:#212c31; --line:#2c3a40; --line-2:#3a4b52;
  --fg:#e8eef0; --muted:#9daeb5; --faint:#7a8b92;
  --brand:#34c27f; --brand-deep:#5fd49b; --brand-ink:#08130d; --brand-soft:#173327; --blue-soft:#172a38;
  --ok:#4fd08f; --ok-bg:#173327; --bad:#f07272; --bad-bg:#3a1d1f; --warn:#f3c54d; --warn-bg:#3a3014; --idle:#a3b1b7; --idle-bg:#263136; --info:#8cc3ec; --info-bg:#172a38;
  --row-err:#2a1c1e; --logo-ink:#f2f5f6; --shadow:none; --scrim:rgba(0,0,0,.6); color-scheme:dark}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
h1,h2,h3{font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.015em}
h1{font-size:28px} h2{font-size:19px;font-weight:600} h3{font-size:16px;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:.88em;letter-spacing:-.01em}
.muted{color:var(--muted)} .small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.label{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}

/* Logo */
.logo{display:block;height:30px;width:auto}
.logo .logo-st3{fill:var(--logo-ink)}
.logo .logo-st0{fill:#2fac66;mix-blend-mode:multiply}
.logo .logo-st1{fill:#6fb0e1;mix-blend-mode:multiply}
.logo .logo-st2{fill:#ffd744;mix-blend-mode:multiply}
.logo .logo-st4{isolation:isolate}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo path{mix-blend-mode:normal}}
:root[data-theme="dark"] .logo path{mix-blend-mode:normal}
.tri{display:grid;grid-template-columns:3fr 2fr 1fr;height:3px}
.tri i:nth-child(1){background:#2fac66}.tri i:nth-child(2){background:#6fb0e1}.tri i:nth-child(3){background:#ffd744}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:99px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-weight:600;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--fg)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{background:var(--brand-deep);border-color:var(--brand-deep)}
.btn.dark{background:var(--fg);border-color:var(--fg);color:var(--surface)}
.btn.danger{border-color:var(--bad);color:var(--bad);background:transparent}
.btn.danger:hover{background:var(--bad-bg)}
.btn.big{min-height:56px;font-size:17px;padding:0 28px}
.btn.sm{min-height:34px;padding:0 14px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary:disabled:hover{background:var(--brand);border-color:var(--brand)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{border-color:var(--line-2)}

/* Login */
.login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr)}
.login-art{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:space-between;gap:40px;padding-block:44px;padding-left:max(44px,env(safe-area-inset-left,0px));padding-right:44px;position:relative;overflow:hidden}
.login-art .logo{height:44px}
.login-art h1{font-size:44px;line-height:1.05;max-width:12ch}
.login-art p{color:var(--muted);max-width:42ch;margin:14px 0 0;font-size:16px}
.blocks{position:absolute;right:-40px;bottom:-40px;width:300px;height:300px;opacity:.9;pointer-events:none}
.blocks i{position:absolute;display:block;mix-blend-mode:multiply}
.blocks i:nth-child(1){width:170px;height:150px;right:40px;top:30px;background:#6fb0e1;border-radius:0 80px 0 0}
.blocks i:nth-child(2){width:160px;height:150px;right:110px;top:120px;background:#2fac66;border-radius:0 0 0 80px}
.blocks i:nth-child(3){width:120px;height:115px;right:220px;top:100px;background:#ffd744;border-radius:0 60px 0 0}
.login-form{display:grid;align-content:center;gap:22px;padding-block:44px;padding-left:44px;padding-right:max(44px,env(safe-area-inset-right,0px))}
.users{display:grid;gap:10px;max-width:540px}
.user-btn{display:flex;align-items:center;gap:14px;text-align:left;padding:13px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);cursor:pointer;box-shadow:var(--shadow)}
.user-btn:hover{border-color:var(--brand)}
.avatar{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;color:#1d1d1b}
.user-btn strong{display:block;font-size:16px}
.user-btn span{font-size:13px;color:var(--muted)}
.user-btn .go{margin-left:auto;color:var(--faint);font-size:20px}

/* Header */
.hdr{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.hdr-in{display:flex;align-items:center;gap:16px;flex-wrap:wrap;min-height:64px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.prod{display:flex;align-items:center;gap:14px;text-decoration:none}
.prod .sep{width:1px;height:26px;background:var(--line-2)}
.prod b{font-size:15px;font-weight:700;letter-spacing:-.01em;display:block;line-height:1.1}
.prod small{display:block;color:var(--muted);font-size:12px}
.hdr .spacer{flex:1}
.clock{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.me{display:flex;align-items:center;gap:10px;padding:4px 6px 4px 4px;border-radius:99px;border:1px solid var(--line)}
.me .avatar{width:32px;height:32px;font-size:12px}
.me b{font-size:13.5px;display:block;line-height:1.1}
.me span{font-size:12px;color:var(--muted)}
.me button{border:0;background:var(--surface-2);border-radius:99px;padding:6px 10px;font-size:12.5px;cursor:pointer;color:var(--muted)}
.me button:hover{color:var(--fg)}
.bellw{position:relative}
.bell{position:relative;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center}
.bell svg{width:20px;height:20px}
.bell .n{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:99px;background:var(--bad);color:#fff;font-size:11.5px;font-weight:700;display:grid;place-items:center}
.bellp{position:absolute;right:0;top:50px;width:min(400px,calc(100vw - 32px));max-height:70vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.18);padding:8px;z-index:40}
.bellp .bh{display:flex;justify-content:space-between;align-items:center;padding:8px 10px}
.nitem{display:grid;gap:2px;padding:10px 12px;border-radius:10px;font-size:13.5px}
.nitem.unread{background:var(--surface-2)}
.nitem small{color:var(--muted)}

/* Shell */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100vh - 67px)}
.side{background:var(--surface);border-right:1px solid var(--line);padding:16px 12px 24px;display:flex;flex-direction:column;gap:14px;position:sticky;top:67px;height:calc(100vh - 67px);overflow:auto}
.grp{display:grid;gap:2px}
.grp .label{padding:6px 12px 4px}
.side a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;text-decoration:none;color:var(--muted);font-weight:600;font-size:14.5px}
.side a:hover{background:var(--surface-2);color:var(--fg)}
.side a.on{background:var(--brand-soft);color:var(--brand-deep)}
.side a svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.side a .cnt{margin-left:auto;font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:99px;background:var(--bad);color:#fff}
.content{min-width:0;max-width:1400px;width:100%;padding-block:26px 60px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:grid;gap:20px;align-content:start}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.head p{margin:6px 0 0;color:var(--muted)}
.crumb{font-size:13px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.crumb a{text-decoration:none}.crumb a:hover{color:var(--brand-deep)}
.ptabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.ptabs button{background:none;border:0;padding:10px 14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.ptabs button.on{color:var(--fg);border-bottom-color:var(--brand)}
.ptabs .c{font-size:12px;color:var(--faint);margin-left:4px}

/* Process cards */
.procs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.proc{position:relative;display:grid;gap:12px;align-content:start;padding:26px;border-radius:18px;border:1px solid var(--line);background:var(--surface);text-align:left;cursor:pointer;text-decoration:none;min-height:210px;box-shadow:var(--shadow);overflow:hidden}
.proc .step{font-family:var(--f-mono);color:var(--faint);font-size:13px}
.proc h2{font-size:30px;font-weight:700}
.proc p{margin:0;color:var(--muted);max-width:34ch}
.proc .tag{position:absolute;top:22px;right:22px;font-size:12px;font-weight:700;padding:5px 11px;border-radius:99px;background:var(--idle-bg);color:var(--idle)}
.proc.soon{background:var(--surface-2);box-shadow:none}
.proc.soon h2,.proc.soon .step{color:var(--faint)}
.proc.live{border-color:var(--brand)}
.proc.live .tag{background:var(--brand);color:var(--brand-ink)}
.proc.live:hover{box-shadow:0 0 0 3px var(--brand-soft)}
.proc .go{margin-top:auto;font-weight:700;color:var(--brand-deep)}
.flow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:13.5px;padding:16px 18px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.flow i{font-style:normal;padding:6px 12px;border-radius:99px;background:var(--surface-2);color:var(--fg);font-weight:500}

/* Status */
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:99px;font-size:12.5px;font-weight:700;white-space:nowrap}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.st-run{color:var(--ok);background:var(--ok-bg)}
.st-stop{color:var(--bad);background:var(--bad-bg)}
.st-idle{color:var(--idle);background:var(--idle-bg)}
.st-warn{color:var(--warn);background:var(--warn-bg)}
.st-info{color:var(--info);background:var(--info-bg)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:7px;font-size:12.5px;font-weight:600;white-space:nowrap}
.c-ok{color:var(--ok);background:var(--ok-bg)}
.c-bad{color:var(--bad);background:var(--bad-bg)}
.c-warn{color:var(--warn);background:var(--warn-bg)}
.c-idle{color:var(--idle);background:var(--idle-bg)}
.c-info{color:var(--info);background:var(--info-bg)}
.tech{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted)}
.tech::before{content:"";width:9px;height:9px;border-radius:2px;background:var(--tc,var(--faint))}

/* KPI strip */
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.stat{padding:16px 18px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:grid;gap:4px;box-shadow:var(--shadow)}
.stat b{font-size:30px;font-weight:700;line-height:1.05}
.stat small{color:var(--muted);font-size:12.5px}

/* Machine cards */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.mcard{display:grid;gap:14px;align-content:start;padding:20px;border-radius:18px;background:var(--surface);border:1px solid var(--line);text-decoration:none;box-shadow:var(--shadow)}
.mcard:hover{border-color:var(--line-2);box-shadow:0 0 0 3px var(--surface-2)}
.mcard.stop{border-color:var(--bad);box-shadow:0 0 0 3px var(--bad-bg)}
.mcard .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mcard h2{font-size:22px;font-weight:700}
.mcard .job{display:grid;gap:4px;min-height:84px;align-content:start}
.mcard .job b{font-weight:600;font-size:15.5px}
.ring{--p:0;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--brand) calc(var(--p)*1%),var(--surface-2) 0);display:grid;place-items:center;flex:none}
.ring span{width:50px;height:50px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:700;font-size:13.5px}
.mcard .meter{display:flex;gap:14px;align-items:center}
.mcard .meter .t{display:grid;gap:4px;font-size:13px;min-width:0}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar span{display:block;height:100%;background:var(--brand);border-radius:99px}
.mcard .foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
.stopband{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:10px;background:var(--bad-bg);color:var(--bad);font-weight:700;font-size:13.5px}
.flags{display:flex;gap:6px;flex-wrap:wrap}

/* Panels */
.cols{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:20px;align-items:start}
.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;display:grid;gap:16px;min-width:0;box-shadow:var(--shadow)}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.panel-h h2{margin-top:2px}
.sub{border-top:1px solid var(--line);padding-top:18px;display:grid;gap:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 18px;font-size:14px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0}
.bigjob{display:grid;gap:4px}
.bigjob .id{font-family:var(--f-mono);color:var(--brand-deep);font-size:13.5px}
.bigjob b{font-size:23px;font-weight:700;letter-spacing:-.015em}
.btns{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.reasons{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.reasons button{min-height:52px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-weight:600;padding:6px 10px}
.reasons button:hover{border-color:var(--bad);color:var(--bad);background:var(--bad-bg)}
.reasons button small{display:block;font-weight:500;font-size:11.5px;color:var(--muted)}
.qlist{display:grid;gap:8px}
.qitem{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;width:100%}
.qitem:hover{border-color:var(--line-2)}
.qitem.sel{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.qitem .ord{font-family:var(--f-mono);font-size:12px;color:var(--faint);width:22px;flex:none}
.qitem .t{display:grid;gap:3px;min-width:0;flex:1}
.qitem .t span{font-size:13px;color:var(--muted)}
.field{display:grid;gap:6px;min-width:0}
.field > label,.field > .lbl{font-size:13px;font-weight:600;color:var(--muted)}
.input{min-height:46px;padding:0 14px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);width:100%}
textarea.input{padding:10px 14px;min-height:84px;resize:vertical}
select.input{padding-right:10px}
.input:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--brand-soft)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:99px;border:1px solid var(--line-2);font-size:13.5px;cursor:pointer}
.checks input{accent-color:var(--brand);width:16px;height:16px}
.rules{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.rules li{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:12px;background:var(--surface-2);font-size:14.5px}
.rules .ic{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700}
.rules .ok .ic{background:var(--brand);color:var(--brand-ink)}
.rules .no{background:var(--bad-bg)}
.rules .no .ic{background:var(--bad);color:var(--surface)}
.rules small{display:block;color:var(--bad);font-size:12.5px;margin-top:2px}

/* Camera summary */
.boxes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.box{padding:13px;border-radius:12px;background:var(--surface-2);display:grid;gap:3px}
.box b{font-size:26px;font-weight:700;line-height:1.1}
.box.err{background:var(--bad-bg)} .box.err b{color:var(--bad)} .box.good b{color:var(--ok)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:680px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;padding:10px 12px;background:var(--surface-2);white-space:nowrap}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:right}
tr.err td{background:var(--row-err)}
tr.err td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
.match{display:grid;gap:2px;font-size:12.5px}
.note-row td{background:var(--surface-2)}
.note-row .inl{display:flex;gap:8px;flex-wrap:wrap}
.note-row .input{min-height:40px;flex:1;min-width:180px}
.note-row select.input{flex:0 1 220px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:99px;padding:3px;gap:2px}
.seg button{background:transparent;border:0;padding:6px 13px;border-radius:99px;cursor:pointer;font-size:13px;color:var(--muted);font-weight:600}
.seg button.on{background:var(--fg);color:var(--surface)}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line-2);border-radius:14px}
.heat td.v{text-align:center;font-weight:700}

/* Planning */
.plan{display:grid;grid-template-columns:340px minmax(0,1fr);gap:20px;align-items:start}
.pool,.col{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;gap:10px;align-content:start}
.pool{max-height:calc(100vh - 220px);overflow:auto}
.board{overflow-x:auto;padding-bottom:6px}
.board-in{display:grid;grid-template-columns:repeat(var(--n,5),minmax(230px,1fr));gap:12px;min-width:min-content}
.col{min-height:320px;background:var(--surface-2);border-color:transparent}
.col.drag,.pool.drag{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.col-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:2px 4px 4px}
.wo{display:grid;gap:6px;padding:12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:13.5px}
.wo[draggable="true"]{cursor:grab}
.wo.late{box-shadow:inset 4px 0 0 var(--bad)}
.wo.today{box-shadow:inset 4px 0 0 var(--yellow)}
.wo.running{border-color:var(--brand)}
.wo .r{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.wo b{font-weight:600}
.wo .acts{display:flex;gap:6px;flex-wrap:wrap}
.wo select{min-height:34px;border-radius:99px;border:1px solid var(--line-2);background:var(--surface);padding:0 10px;font-size:13px;flex:1;min-width:0}
.iconbtn{min-width:34px;min-height:34px;border-radius:50%;border:1px solid var(--line-2);background:transparent;cursor:pointer;color:var(--muted)}
.iconbtn:hover{color:var(--fg);border-color:var(--fg)}
.iconbtn:disabled{opacity:.3;cursor:not-allowed}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* Automations */
.autos{display:grid;gap:12px}
.auto{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;padding:16px 18px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.auto.off{opacity:.6;box-shadow:none;background:var(--surface-2)}
.auto .ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand-deep)}
.auto .ico svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.auto h3{font-size:16px}
.sentence{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13.5px;color:var(--muted);margin-top:6px}
.sentence .tok{padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--fg);font-weight:600}
.sentence .tok.when{background:var(--blue-soft)}
.sentence .tok.then{background:var(--brand-soft);color:var(--brand-deep)}
.switch{position:relative;width:46px;height:26px;flex:none}
.switch input{opacity:0;width:100%;height:100%;margin:0;position:absolute;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:99px;background:var(--line-2);transition:.2s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked + span{background:var(--brand)}
.switch input:checked + span::after{transform:translateX(20px)}
.switch input:focus-visible + span{outline:2px solid var(--brand);outline-offset:2px}

/* Settings */
.defs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:start}
.deflist{display:grid;gap:8px}
.defrow{display:flex;gap:8px;align-items:center}
.defrow .input{min-height:42px}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tagx{display:inline-flex;align-items:center;gap:6px;padding:6px 6px 6px 13px;border-radius:99px;background:var(--surface-2);font-size:13.5px}
.tagx button{border:0;background:var(--surface);border-radius:50%;width:24px;height:24px;cursor:pointer;color:var(--muted)}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:var(--surface-2);cursor:pointer}
.toggle input{width:22px;height:22px;accent-color:var(--brand)}
.perm td.v{text-align:center}
.yes{color:var(--ok);font-weight:700}.no{color:var(--faint)}

/* Modal */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:60;display:grid;place-items:center;padding:20px}
.modal{width:min(640px,100%);max-height:calc(100vh - 40px);overflow:auto;background:var(--surface);border-radius:20px;padding:24px;display:grid;gap:16px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal .mh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.modal .mf{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px}
.err-line{color:var(--bad);font-weight:600;font-size:13.5px}
.hint{font-size:12.5px;color:var(--muted)}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--fg);color:var(--surface);padding:12px 20px;border-radius:99px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast.bad{background:var(--bad);color:#fff}

@media (max-width:1150px){.cols,.cols2{grid-template-columns:1fr}.plan{grid-template-columns:1fr}.pool{max-height:none}.boxes{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:900px){
  .login{grid-template-columns:1fr}
  .login-art{border-right:0;border-bottom:1px solid var(--line);padding-block:28px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
  .login-art h1{font-size:32px}
  .blocks{display:none}
  .login-form{padding-block:28px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
  .hdr-in{gap:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .clock,.me div,.sim-t{display:none}
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;overflow-x:auto;gap:4px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-right:0;border-bottom:1px solid var(--line)}
  .grp{display:flex;gap:2px}.grp .label{display:none}
  .side a{white-space:nowrap}
  .content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .procs{grid-template-columns:1fr}.proc{min-height:0}
  .strip{grid-template-columns:repeat(2,minmax(0,1fr))}
  .defs,.grid2,.grid3{grid-template-columns:1fr}
  .boxes{grid-template-columns:repeat(2,minmax(0,1fr))}
  .auto{grid-template-columns:minmax(0,1fr) auto}.auto .ico{display:none}
}
@media (max-width:520px){.prod .sep,.prod div{display:none}.logo{height:24px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* v4: saha formları, kamera, pano, Excel */
.yn{display:flex;gap:6px;flex:none}
.yn button{min-height:38px;padding:0 14px;border-radius:99px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-weight:600;font-size:13px}
.yn button.on.y{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.yn button.on.n{background:var(--bad);border-color:var(--bad);color:#fff}
.qrow{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--surface-2);font-size:14px}
.qrow > span{min-width:0}
.chipsel{display:flex;flex-wrap:wrap;gap:6px}
.chipsel button{padding:7px 12px;border-radius:99px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-size:13px;font-weight:600}
.chipsel button.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.chipsel button.on{background:var(--fg);color:var(--surface);border-color:var(--fg)}
.upcard{padding:14px 16px;border-radius:14px;background:var(--warn-bg);display:grid;gap:10px;color:var(--fg)}
.upcard.ok{background:var(--ok-bg)}
.camhdr{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border-radius:12px;background:var(--surface-2);font-size:13px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-bg);flex:none}
.camimg{width:100%;height:auto;border-radius:12px;display:block}
.slots td.v{font-weight:700;text-align:right}
.slots tr.hit td.v{color:var(--ok)}
.slots tr.miss td.v{color:var(--bad)}
.slots tr.now td{background:var(--blue-soft)}
.slots input{min-height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:0 8px;width:100%;font-size:13px}
.drop{border:2px dashed var(--line-2);border-radius:14px;padding:22px;text-align:center;display:grid;gap:10px;justify-items:center}
.drop.on{border-color:var(--brand);background:var(--brand-soft)}
.reasons-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.reasons-grid label{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 5px 5px 12px;border-radius:10px;background:var(--surface-2);font-size:13px}
.reasons-grid input{width:88px;min-height:34px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);padding:0 8px;text-align:right;font-variant-numeric:tabular-nums}
.modal.wide{width:min(1000px,100%)}
.sumline{display:flex;flex-wrap:wrap;gap:8px}
.mini{display:grid;gap:2px;padding:10px 12px;border-radius:12px;background:var(--surface-2);min-width:118px}
.mini b{font-size:18px;font-variant-numeric:tabular-nums}
.mini.bad b{color:var(--bad)} .mini.ok b{color:var(--ok)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.filters .field{min-width:160px}

/* v5: Lark tarzı planlama */
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.step{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:grid;gap:10px;align-content:start;box-shadow:var(--shadow)}
.step .n{font-size:12px;font-weight:700;color:var(--brand-deep);text-transform:uppercase;letter-spacing:.08em}
.step p{margin:0}
.step .drop{padding:16px;cursor:pointer}
tr.wrn td{background:var(--warn-bg)}
.gantt{min-width:980px;display:grid;gap:6px}
.g-r{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px;align-items:center}
.g-l{font-weight:700;font-size:14px;text-decoration:none;display:grid;gap:2px}
.g-l small{font-weight:500;color:var(--muted);font-size:12px}
.g-b{position:relative;height:50px;border-radius:10px;background:repeating-linear-gradient(90deg,var(--surface-2) 0 calc(100%/12 - 1px),var(--line) calc(100%/12 - 1px) calc(100%/12))}
.g-t{position:relative;height:18px}
.g-t span{position:absolute;top:0;font-size:11.5px;color:var(--muted);transform:translateX(-50%)}
.g-j{position:absolute;top:6px;height:38px;border-radius:8px;border:0;padding:0 8px;display:flex;align-items:center;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-decoration:none;color:#14191c;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.g-j.run{background:var(--brand);color:var(--brand-ink)}
.g-j.q{background:var(--blue-soft);color:var(--fg);box-shadow:inset 0 0 0 1px var(--blue)}
.g-j.done{background:var(--idle-bg);color:var(--muted)}
.g-j.stop{background:var(--bad);color:#fff}
.g-now{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--bad);border-radius:2px}
@media (max-width:900px){.steps{grid-template-columns:1fr}}
</style></head>

function rollBoard(){const ds=dayStart(Date.now());S.machines.forEach(m=>{const b=S.board[m.id];if(!b||b.day!==ds)S.board[m.id]={day:ds,slots:Array.from({length:12},()=>({prod:0,bad:0,setup:0,note:''}))}})}
function slotData(m){
  rollBoard();const b=S.board[m.id],ds=b.day;
  const live=Array.from({length:12},()=>({prod:0,bad:0,setup:0}));
  Object.values(S.orders).forEach(o=>{if(o.machine!==m.id&&!(o.boxes.length&&o.boxes[0].m===m.id))return;
    o.boxes.forEach(x=>{if(x.ts<ds||x.ts>=ds+DAY||!x.live)return;const i=Math.floor((x.ts-ds)/SLOT);live[i].prod+=x.count;if(x.result!=='OK')live[i].bad+=o.perDeste});
    if(o.startedAt&&o.startedAt>=ds&&o.startedAt<ds+DAY&&o.kop&&o.kop.live)live[Math.floor((o.startedAt-ds)/SLOT)].setup++});
  return b.slots.map((s,i)=>({i,prod:s.prod+live[i].prod,bad:s.bad+live[i].bad,setup:s.setup+live[i].setup,note:s.note}));
}

const METRICS={

  errRate:{n:'Son 10 kolide hata oranı',u:'%',v:m=>{const w=m.current&&W(m.current);if(!w||w.boxes.length<5)return null;const l=w.boxes.slice(-10);return Math.round(l.filter(b=>b.result!=='OK').length/l.length*100)}},
  slotPct:{n:'Son 2 saatlik dilimde hedef gerçekleşme',u:'%',v:m=>{if(m.status==='idle')return null;const i=slotOf(Date.now())-1;if(i<0)return null;const s=slotData(m)[i];return s.prod?Math.round(s.prod/S.rules.slotTarget*100):null}},
  unrev:{n:'İncelenmemiş hatalı koli',u:'koli',v:m=>{const w=m.current&&W(m.current);return w?errs(w).filter(b=>!b.reviewed).length:0}},
  pmLate:{n:'Geciken periyodik bakım',u:'adet',v:m=>S.pm.filter(t=>t.machine===m.id&&pmLate(t)).length},
  idleQ:{n:'Sırada iş varken boşta kalma süresi',u:'dk',v:m=>m.status==='idle'&&m.queue.length&&m.idleSince?mins(m.idleSince):0}};

const fmtV=(k,v)=>METRICS[k].u==='%'?'%'+v:v+' '+METRICS[k].u;
function runAuto(silent){
  const fired=[];
  S.autos.forEach(a=>{S.machines.forEach(m=>{const key=a.id+':'+m.id,v=METRICS[a.metric].v(m),hit=a.on&&test(v,a.op,a.th);if(hit&&!S.autoState[key])fired.push(fire(a,m,v));S.autoState[key]=!!hit})});
  if(fired.length&&!silent)setTimeout(()=>{toast('Otomasyon: '+fired[0].title+(fired.length>1?' (+'+(fired.length-1)+')':''));updBell()},1800);

}
function fire(a,m,v){

  const body=`${METRICS[a.metric].n}: ${run.value} (eşik ${OPS[a.op]} ${fmtV(a.metric,a.th)})`,w=m.current&&W(m.current);
  if(a.res==='action'){const x={id:nextId('AK'),title:a.name+': '+m.name,src:'Otomasyon: '+a.name,machine:m.id,owner:a.owner,due:Date.now()+a.days*DAY,status:'Açık',created:Date.now(),note:body};S.actions.unshift(x);run.res=x.id}
  if(a.res==='ncr'){const x={id:nextId('UG'),machine:m.id,wo:w?w.id:null,code:a.metric==='mix'?'PMIX':'QTY',boxes:a.metric==='mix'?v:0,desc:body,status:'Açık',decision:'',root:'',created:Date.now(),closed:null,src:'Otomasyon: '+a.name};S.ncrs.unshift(x);run.res=x.id}
  if(a.res==='maint'){const x={id:nextId('BT'),machine:m.id,type:'Arıza',desc:body,status:'Açık',created:Date.now(),startedAt:null,doneAt:null,note:'',src:'Otomasyon: '+a.name};S.maint.unshift(x);run.res=x.id}

function startRules(m,woId){

  if(R.clean){const y=k.clean.filter(x=>x===1).length,n=k.clean.filter(x=>x===-1).length;out.push({l:'Hat temizlik kontrolünde 5 sorunun hepsi “Evet” olmalı',ok:y===5,why:n?n+' soru “Hayır” cevaplandı. Hat temizlenmeden iş başlamaz.':(5-y)+' soru cevaplanmadı'})}

function finishRules(m,wo){

function schedule(m){

function checkRows(raw,file){

  const seen={};

    const errsL=[],w=[];

    const miss=[!o.sd&&'SD No',!o.customer&&'Müşteri',!o.artikel&&'Artikel',!o.name&&'Stok Adı',!o.qty&&'İş Miktarı'].filter(Boolean);if(miss.length)errsL.push('Zorunlu alan eksik: '+miss.join(', '));
    if(o.sd&&S.orders[o.sd])errsL.push('Bu SD sistemde zaten var');
    if(o.sd&&seen[o.sd])errsL.push('Dosyada SD tekrar ediyor');
    if(!o.due)w.push('Teslim tarihi yok, 3 gün sonrası alınır');else if(dayKey(o.due)<dayKey(Date.now()))w.push('Teslim tarihi geçmiş');

  return {file,rows,missingCols};
}

  const fr=new FileReader();fr.onload=e=>{try{const wb=XLSX.read(e.target.result,{type:'array',cellDates:false});const ws=wb.Sheets[wb.SheetNames[0]];const raw=XLSX.utils.sheet_to_json(ws,{defval:''});
    if(!raw.length){U.err='Dosyada satır bulunamadı. İlk sayfanın ilk satırı başlık olmalı.';render();return}

function assign(woId,mid){
  const o=W(woId);if(!o||o.status==='calisiyor'||o.status==='bitti')return;
  S.machines.forEach(m=>{m.queue=m.queue.filter(x=>x!==woId)});
  if(mid==='pool'){o.status='havuz';o.machine=null;toast('SD '+o.id+' havuza alındı')}
  else{const m=M(mid);m.queue.push(woId);o.status='sirada';o.machine=mid;toast('SD '+o.id+' → '+m.name);notify('Yeni iş: SD '+o.id,m.name+' sırasına eklendi · '+o.name,['koparma'])}
  audit('İş ataması','SD '+o.id+' → '+(mid==='pool'?'Havuz':mName(mid)));save();render();
}
function simulate(){
  const r=Math.random;let n=0;
  S.machines.forEach(m=>{if(m.status!=='run'||!m.current)return;const wo=W(m.current),k=1+Math.floor(r()*2);m.lastQuery=Date.now();
    for(let i=0;i<k;i++){const x=r();const res=x<.07?'CMIX':x<.13?'PMIX':x<.18?'QTY':'OK';const b=addBox(wo,Date.now()-(k-i-1)*20000,res,r,false);if(!b)break;b.live=1;n++}});
  const f=runAuto(true);persist();render();
  toast(n?`Kameralardan ${n} yeni koli sonucu alındı`+(f.length?' · '+f.length+' otomasyon çalıştı':''):'Çalışan makine yok. Önce bir işi başlatın.',!n);
}
function finish(m){
  const wo=W(m.current),f=finState(m,wo),pr=produced(wo),bz=finBozuk(f);
  wo.pakon={kontrol:pr,bozuk:bz,saglam:pr-bz,reasons:Object.fromEntries(Object.entries(f.reasons).filter(x=>+x[1]>0).map(x=>[x[0],+x[1]])),count:+f.count,weight:f.weight,p1:f.p1,p2:f.p2,ook4:f.ook4,durum:f.durum,by:me(),ts:Date.now(),masa:m.masa};
  m.current=null;m.status='idle';m.idleSince=Date.now();m.stopReason=null;m.stopSince=null;delete U.fin[m.id];
  if(f.durum==='Devam'){wo.status='havuz';wo.machine=null;wo.done=pr;audit('Pakon formu · devam','SD '+wo.id+' · '+N(pr)+' paketlendi, havuza döndü');save();render();toast('SD '+wo.id+' havuza döndü. '+m.name+' boşta.');return}
  wo.status='bitti';wo.finishedAt=Date.now();audit('Pakon formu · bitti','SD '+wo.id+' · '+m.name+' · %'+P1(pct(wo))+' · bozuk '+N(bz));save();render();toast('SD '+wo.id+' bitti. '+m.name+' boşta.');
}
